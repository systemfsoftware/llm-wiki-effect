name: Setup Node runtime
description: Install Node.js and enable Corepack, which provides the pnpm version pinned by packageManager

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable
    - uses: actions/setup-node@v7
      with:
        node-version: "24"
        cache: pnpm
