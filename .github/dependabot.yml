version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: "increase"
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      toolchain-minor-patch:
        patterns: [
          "oxlint",
          "oxlint-tsgolint",
          "dprint",
          "husky",
          "lint-staged",
          "@commitlint/*",
          "@changesets/*",
          "turbo",
        ]
        update-types: ["minor", "patch"]
      toolchain-major:
        patterns: [
          "oxlint",
          "oxlint-tsgolint",
          "dprint",
          "husky",
          "lint-staged",
          "@commitlint/*",
          "@changesets/*",
          "turbo",
        ]
        update-types: ["major"]
      types-minor-patch:
        patterns: ["@types/*"]
        update-types: ["minor", "patch"]
      other-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - "oxlint"
          - "oxlint-tsgolint"
          - "dprint"
          - "husky"
          - "lint-staged"
          - "@commitlint/*"
          - "@changesets/*"
          - "turbo"
          - "@types/*"
        update-types: ["minor", "patch"]
      other-major:
        patterns: ["*"]
        exclude-patterns:
          - "oxlint"
          - "oxlint-tsgolint"
          - "dprint"
          - "husky"
          - "lint-staged"
          - "@commitlint/*"
          - "@changesets/*"
          - "turbo"
          - "@types/*"
        update-types: ["major"]

  # Desktop app: react, tauri, vite/vitest, and the moved runtime set.
  - package-ecosystem: "npm"
    directory: "/apps/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: "increase"
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      react-minor-patch:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      react-major:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["major"]
      tauri-minor-patch:
        patterns: ["@tauri-apps/*"]
        update-types: ["minor", "patch"]
      tauri-major:
        patterns: ["@tauri-apps/*"]
        update-types: ["major"]
      testing-minor-patch:
        patterns: ["vitest", "@vitest/*", "fast-check"]
        update-types: ["minor", "patch"]
      testing-major:
        patterns: ["vitest", "@vitest/*", "fast-check"]
        update-types: ["major"]
      types-minor-patch:
        patterns: ["@types/*"]
        update-types: ["minor", "patch"]
      other-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/*"
          - "@tauri-apps/*"
          - "vitest"
          - "@vitest/*"
          - "fast-check"
        update-types: ["minor", "patch"]
      other-major:
        patterns: ["*"]
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/*"
          - "@tauri-apps/*"
          - "vitest"
          - "@vitest/*"
          - "fast-check"
        update-types: ["major"]

  # MCP server: bundled into the app as a Tauri resource, versioned
  # independently.
  - package-ecosystem: "npm"
    directory: "/apps/mcp-server"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: "increase"
    open-pull-requests-limit: 15
    groups:
      other-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      other-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "npm"
    directory: "/apps/api-server"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: "increase"
    open-pull-requests-limit: 15
    groups:
      other-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      other-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "npm"
    directory: "/packages/oxlint-config"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: "increase"
    groups:
      other-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      other-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "npm"
    directory: "/packages/protocol"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: "increase"
    groups:
      other-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      other-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The flake's `comment-checker` input carries `nix/release-hashes.json`, so a
  # bump of it moves the pinned version and the four release digests together —
  # no sum in `nix/comment-checker.nix` is edited by hand.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
