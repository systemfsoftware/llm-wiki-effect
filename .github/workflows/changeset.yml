name: Changeset

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "extension/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  require-changeset:
    name: an app change needs a change intent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # changeset status diffs the branch against the PR base commit.
          fetch-depth: 0

      - name: Install workspace dependencies
        uses: ./.github/actions/install-deps

      - name: Require a change intent
        run: corepack pnpm exec changeset status --since "${{ github.event.pull_request.base.sha }}"
