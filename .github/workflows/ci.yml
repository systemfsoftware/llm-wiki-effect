name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conflicts:
    name: no merge conflicts
    uses: ./.github/workflows/conflict-check.yml
    with:
      base_ref: ${{ github.event.pull_request.base.ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  check:
    name: gate · lint · typecheck · test · build (${{ matrix.platform }})
    needs: conflicts
    timeout-minutes: 45
    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install protobuf

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Install protoc (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install protoc -y

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install workspace dependencies
        uses: ./.github/actions/install-deps

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-gate-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-gate-
            turbo-${{ runner.os }}-

      - name: Gate
        shell: bash
        run: corepack pnpm check:ci

      - name: Check Rust build
        working-directory: src-tauri
        run: cargo build
