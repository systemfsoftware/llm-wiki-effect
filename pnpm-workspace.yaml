packages:
  - "apps/*"
  - "packages/*"

# Versions shared by more than one package live here so the desktop app and the
# MCP server cannot drift apart. `rolldown` is pinned to the same range vite
# resolves so the MCP server is bundled by exactly one copy of the bundler.
catalog:
  "@changesets/cli": ^3.0.2
  "@commitlint/cli": ^21.2.2
  "@commitlint/config-conventional": ^21.2.2
  "@commitlint/types": ^21.2.0
  "@systemfsoftware/all": 2.0.1
  "@systemfsoftware/effect-gherkin-spec": 4.0.1
  "@systemfsoftware/tsconfig": 1.3.3
  dprint: 0.54.0
  husky: ^9.1.7
  lint-staged: ^17.1.0
  oxlint: ^1.82.0
  oxlint-tsgolint: 7.0.2001
  rolldown: ~1.2.6
  turbo: ^2.10.12
  "effect": 4.0.0-rc.113
  "@effect/platform-node": 4.0.0-rc.113
  "@effect/vitest": 4.0.0-rc.113
  "fast-check": ^4.7.0
  "vitest": ^4.1.4
  "@stryker-mutator/core": 10.0.0
  "@stryker-mutator/vitest-runner": 10.0.0
  "typescript": ^5.7.3

catalogMode: prefer

# Supply-chain quarantine: pnpm refuses any version published less than 24h
# ago, so a freshly hijacked release cannot reach the lockfile on install.
minimumReleaseAge: 1440

# Dependency install scripts stay blocked (pnpm's default). `dprint` is the one
# exception: its npm package is a launcher that fetches the platform binary in a
# postinstall, and the version is pinned exactly (0.54.0) so the script cannot
# pull a release the tree was not formatted with. Never widen this to a wildcard.
allowBuilds:
  dprint: true
